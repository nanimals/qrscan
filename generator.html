<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QR Generator</title>
  <style>
    body {
      background-color: #000000;
      color: #000000;
      font-family: monospace;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .window {
      background: #615353;
      border: 2px solid #333333;
      padding: 20px;
      width: 100%;
      max-width: 450px;
    }
    textarea, button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      background: #222;
      border: 1px solid #444;
      color: #ffffff;
      font-family: monospace;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      background: #fbff00;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #e5ff00;
    }
    #qrContainer {
      margin-top: 15px;
      text-align: center;
      display: none;
    }
    img {
      margin-top: 10px;
      border: 4px solid #fff;
    }
    #progress-container {
      display: none;
      width: 100%;
      margin-top: 10px;
    }
    #progress-bar {
      width: 100%;
      background: #222;
      border: 1px solid #444;
      height: 14px;
      box-sizing: border-box;
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      background: #fbff00;
      transition: width 0.05s linear;
    }
    #progress-text {
      font-size: 11px;
      color: #fbff00;
      margin-top: 4px;
    }
  </style>
  <script>
    async function generateCompressedQR() {
      var textData = document.getElementById("link").value.trim();
      if (!textData) {
        alert("Please enter the student's health paragraph!");
        return;
      }

      const progressContainer = document.getElementById("progress-container");
      const progressFill = document.getElementById("progress-fill");
      const progressText = document.getElementById("progress-text");
      progressContainer.style.display = "block";

      try {
        progressFill.style.width = "20%";
        progressText.textContent = "ENCODING DATA... 20%";
        await new Promise(r => setTimeout(r, 100));

        // 1. Native GZIP Compression Stream (NASA-level web compression)
        const stream = new Blob([textData]).stream().pipeThrough(new CompressionStream('gzip'));
        const compressedBuffer = await new Response(stream).arrayBuffer();
        
        progressFill.style.width = "60%";
        progressText.textContent = "COMPRESSING (GZIP)... 60%";
        await new Promise(r => setTimeout(r, 100));

        // 2. Convert to Base64
        let binaryString = '';
        const bytes = new Uint8Array(compressedBuffer);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) {
          binaryString += String.fromCharCode(bytes[i]);
        }
        const base64Compressed = btoa(binaryString);

        progressFill.style.width = "85%";
        progressText.textContent = "REVERSING PAYLOAD... 85%";
        await new Promise(r => setTimeout(r, 100));

        // 3. Reverse string so cameras don't open it directly
        const flipped = base64Compressed.split('').reverse().join('');
        const finalPayload = "GZIP:" + flipped;

        // 4. Generate QR
        var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(finalPayload);
        
        progressFill.style.width = "100%";
        progressText.textContent = "DONE ✓";

        document.getElementById("qrImg").src = qrUrl;
        document.getElementById("qrContainer").style.display = "block";
      } catch (err) {
        progressText.textContent = "COMPRESSION FAILED ✗";
        alert("Error: " + err.message);
      }
    }
  </script>
</head>
<body>

  <div class="window">
    <h3>𝙷𝚎𝚊𝚕𝚝𝚑 𝚙𝚊𝚜𝚜𝚙𝚘𝚛𝚝 𝙴𝚀𝚁 𝚐𝚎𝚗𝚎𝚛𝚊𝚝𝚘𝚛</h3>
    
    <style>color: #fff; font-size: 13px;</style>
     <img src="https://media.tenor.com/WblaMue-oPEAAAAm/%E5%88%9D%E9%9F%B3%E3%83%9F%E3%82%AF-hatsune-miku.webp" style="width:100px;height:100px;">
    <p>codename: miku64</p>

       Instructions
<br>
1️⃣. Enter student's full health paragraph below<br>
2️⃣. Generate and take a screenshot of the compact QR code<br>
3️⃣. Paste or scan it into your reader page
    </p>
    
    <textarea id="link" rows="5" placeholder="Enter student health paragraph..."></textarea>
    <button onclick="generateCompressedQR()">✓ SUBMIT & COMPRESS</button>

    <div id="progress-container">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="progress-text">READY</div>
    </div>

    <div id="qrContainer">
      <p style="font-size: 12px; color: #00ff88;">Compressed QR Generated!</p>
      <img id="qrImg" alt="Your QR Code will appear here">
    </div>
  </div>

</body>
</html>
