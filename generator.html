<!DOCTYPE html>
<html>
<head>
  <style>@import exo2.css;</style>
  <title>QR Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    function makeQR() {
      var url = document.getElementById("link").value;
      if (url) {
        // Reverse the URL string so normal phone cameras can't open it
        var flippedUrl = url.split('').reverse().join('');
        
        // Put the flipped text into the QR code API abomination
        document.getElementById("qrImg").src = 
          "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(flippedUrl);
      }
    }
  </script>
</head>
<body>

  <h3>Health Passport QR Generator</h3>
  
  <P>
    INSTRUCTIONS
	<br>
    1. Enter your prescription's url 
    <br>
	2. take a screen shot and cut out the QR code 
    <br>
	3. Paste the QR CODE in the form you were given
  </P>
  
  <input type="text" id="link" placeholder="Enter health website URL...">
  <button onclick="makeQR()">Generate Secure QR</button>

  <br><br>
  <img id="qrImg" src="" alt="Your QR Code will appear here">

</body>
</html>
